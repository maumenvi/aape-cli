name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install devtools dependencies
        run: npm ci --prefix packages/aape-devtools

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Package core (@maumenvi/aape)
        run: npm pack

      - name: Package devtools (@maumenvi/aape-devtools)
        run: npm pack --prefix packages/aape-devtools

      - name: Create test directory for core smoke test
        run: mkdir -p /tmp/test-core && cd /tmp/test-core && npm init -y

      - name: Install core tarball in test directory
        run: |
          cd /tmp/test-core
          npm install ${{ github.workspace }}/maumenvi-aape-1.4.0.tgz

      - name: Smoke test: core import and basic functionality
        run: |
          cd /tmp/test-core
          node -e "
          const { createPipeline, createLlmManager } = require('./node_modules/@maumenvi/aape');
          const pipeline = createPipeline();
          console.log('✓ Core pipeline created successfully');
          const llm = createLlmManager();
          console.log('✓ Core LLM manager created successfully');
          "

      - name: Create test directory for devtools smoke test
        run: mkdir -p /tmp/test-devtools && cd /tmp/test-devtools && npm init -y

      - name: Install core and devtools tarballs in test directory
        run: |
          cd /tmp/test-devtools
          npm install ${{ github.workspace }}/maumenvi-aape-1.4.0.tgz
          npm install ${{ github.workspace }}/maumenvi-aape-devtools-1.4.0.tgz

      - name: Smoke test: devtools integration with core
        run: |
          cd /tmp/test-devtools
          node -e "
          const core = require('./node_modules/@maumenvi/aape');
          const devtools = require('./node_modules/@maumenvi/aape-devtools');
          console.log('✓ Core loaded');
          console.log('✓ DevTools loaded');
          console.log('✓ Integration smoke test passed');
          "

      - name: Validate package
        run: npm pack --dry-run
